services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SOURCE_CODE_URL: ${NEXT_PUBLIC_SOURCE_CODE_URL:-https://github.com/afufu/float-friends}
        NEXT_PUBLIC_PLATFORM_AI_MANAGED: "true"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SELF_HOSTED_MODE: "false"
      NEXT_PUBLIC_OPEN_REGISTRATION: "true"
      OPEN_REGISTRATION: "true"
      ACCOUNT_SQLITE_PATH: /data/accounts/accounts.sqlite
      ACCOUNT_STORAGE_ROOT: /data/storage
      PLATFORM_AI_BASE_URL: ${PLATFORM_AI_BASE_URL:-http://gateway:8787/v1}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-gpt-5.5}
    ports:
      - "${FLOAT_BIND_ADDRESS:-127.0.0.1}:${FLOAT_PORT:-3100}:3000"
    volumes:
      - float_data:/data
    networks:
      default: {}
      hiphone:
        aliases:
          - float-friends
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  float_data:

networks:
  hiphone:
    external: true
    name: hiphone_default
